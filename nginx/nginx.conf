worker_processes auto;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_max_body_size 16m;
  gzip on;
  gzip_types application/json text/plain application/javascript text/css;

  server {
    listen 80;
    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / {
      # A variable forces Docker DNS lookup instead of freezing one container IP
      # at nginx start. Docker DNS rotates the scaled app service addresses.
      set $trendova_upstream app:8000;
      proxy_pass http://$trendova_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}

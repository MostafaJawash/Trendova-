# Req 3 runs in its own compose project (fresh volumes) so the earlier dev data volume of project
# "trendova-" is never touched. Restore the old dev stack with: docker compose -p trendova- up -d
name: trendova-req3

x-app-env: &app-env
  DATABASE_HOST: db
  DATABASE_PORT: 3306
  DATABASE_REPLICA_HOST: db-replica
  REDIS_URL: redis://redis:6379/0
  INVENTORY_GRPC_ADDR: inventory-service:50051
  INVENTORY_MODE: grpc
  DB_QUERY_COUNT: ${DB_QUERY_COUNT:-0}

x-app: &app-base
  build:
    context: .
  image: trendova-req3-app
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    inventory-service:
      condition: service_started
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 10

services:
  db:
    image: mysql:8.0
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-ecommerce}
    # Primary: binary log + GTID so a replica can be attached with SOURCE_AUTO_POSITION=1.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci",
      "--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON",
      "--enforce-gtid-consistency=ON", "--binlog-expire-logs-seconds=86400"]
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/sql/01_create_schema.sql:/docker-entrypoint-initdb.d/01_create_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    <<: *app-base
    environment:
      <<: *app-env
      USE_READ_REPLICA: ${USE_READ_REPLICA:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      ETAG_ENABLED: ${ETAG_ENABLED:-true}
    ports: ["8000:8000"]
    volumes: ["uploads:/app/uploads"]
  db-replica:
    image: mysql:8.0   # SAME tag as the primary
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    # read_only / super_read_only are enabled by scripts/replica_init.sh with SET PERSIST: they cannot be
    # passed here because the image entrypoint must write while it initialises a fresh data directory.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci",
      "--server-id=2", "--relay-log=relay-bin", "--gtid-mode=ON", "--enforce-gtid-consistency=ON",
      "--log-bin=mysql-bin", "--log-replica-updates=ON", "--binlog-expire-logs-seconds=86400"]
    ports: ["3308:3306"]
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./scripts/replica_health.sh:/replica_health.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh /replica_health.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  replica-init:
    image: mysql:8.0
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-ecommerce}
    entrypoint: ["sh", "/replica_init.sh"]
    volumes: ["./scripts/replica_init.sh:/replica_init.sh:ro"]
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_started
    restart: "no"
  redis:
    image: redis:7-alpine
    command: ["redis-server","--maxmemory","256mb","--maxmemory-policy","allkeys-lru","--save","","--appendonly","no"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory-local-password}
    volumes:
      - inventory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 20
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD:-inventory-local-password}@inventory-db:5432/inventory?sslmode=disable
      GRPC_PORT: 50051
    depends_on:
      inventory-db:
        condition: service_healthy
  # ---- A/B variants for interleaved benchmarks (profile "ab"); same databases, different code/flags ----
  # app-v0: image built from the last commit BEFORE any Req 3 change (scripts/ab_build.py).
  app-v0:
    profiles: ["ab"]
    image: trendova-req3-baseline
    env_file: .env
    environment: {DATABASE_HOST: db, DATABASE_PORT: 3306, INVENTORY_GRPC_ADDR: "inventory-service:50051", INVENTORY_MODE: grpc}
    depends_on: {db: {condition: service_healthy}, inventory-service: {condition: service_started}}
    ports: ["8010:8000"]
  app-v1:   # new code, indexes + query fixes, everything else off
    <<: *app-base
    profiles: ["ab"]
    environment: {<<: *app-env, USE_READ_REPLICA: "false", CACHE_ENABLED: "false", ETAG_ENABLED: "false"}
    ports: ["8011:8000"]
  app-v2:   # + read replica
    <<: *app-base
    profiles: ["ab"]
    environment: {<<: *app-env, USE_READ_REPLICA: "true", CACHE_ENABLED: "false", ETAG_ENABLED: "false"}
    ports: ["8012:8000"]
  app-v3:   # + Redis cache
    <<: *app-base
    profiles: ["ab"]
    environment: {<<: *app-env, USE_READ_REPLICA: "true", CACHE_ENABLED: "true", ETAG_ENABLED: "false"}
    ports: ["8013:8000"]
  app-diag: # V1 flags + DB_QUERY_COUNT=1 -> X-DB-Query-Count / X-Inventory-Rpc-Calls headers (diagnostics, never benchmarked)
    <<: *app-base
    profiles: ["ab"]
    environment: {<<: *app-env, DB_QUERY_COUNT: "1", DIAG_ALLOW_STOCK_MODE: "1", USE_READ_REPLICA: "false", CACHE_ENABLED: "false", ETAG_ENABLED: "false"}
    ports: ["8030:8000"]
  app-prev: # previous image of the change under test (per-change A/B, scripts/ab_build.py)
    profiles: ["ab"]
    image: trendova-req3-prev
    env_file: .env
    environment: {<<: *app-env, USE_READ_REPLICA: "false", CACHE_ENABLED: "false", ETAG_ENABLED: "false"}
    depends_on: {db: {condition: service_healthy}, inventory-service: {condition: service_started}}
    ports: ["8020:8000"]
  # Live-test runner (profile "test"): docker CLI + socket so tests can stop/start Redis, the replica and the inventory service.
  tester:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: trendova-req3-tester
    profiles: ["test"]
    user: root
    env_file: .env
    environment:
      E2E_BASE_URL: http://app:8000/api/v1
      E2E_V1_URL: http://app-v1:8000/api/v1
      E2E_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      E2E_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      REQ3_DB_URL: mysql+pymysql://root:${DATABASE_PASSWORD}@db:3306/${DATABASE_NAME:-ecommerce}
      INVENTORY_GRPC_ADDR: inventory-service:50051
      INVENTORY_MODE: fake
      COMPOSE_PROJECT_NAME: trendova-req3
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./scripts:/app/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["python", "-m", "pytest", "-p", "no:cacheprovider"]
  # Load generator, runs inside the compose network: scripts/bench.py drives it.
  k6:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000/api/v1
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ./loadtest:/loadtest
    working_dir: /loadtest
    entrypoint: ["k6"]
    command: ["run", "/loadtest/k6/main.js"]
volumes:
  uploads:
  mysql_data:
  mysql_replica_data:
  inventory_pg_data:

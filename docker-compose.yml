services:
  db:
    image: mysql:8.0
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-ecommerce}
    ports: ["3307:3306"]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      INVENTORY_MODE: fake
    depends_on: [db]
    ports: ["8000:8000"]
